name: campaign-pool-build

on:
  push:
    branches:
      - feature/equireign-extension-final
  workflow_dispatch:

jobs:
  build-campaign-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate 6x6-16x16 campaign pool
        run: npm run puzzles:build -- 30 artifacts/generated-pool.json
      - name: Upload campaign pool
        uses: actions/upload-artifact@v4
        with:
          name: campaign-pool-6-to-16
          path: artifacts/generated-pool.json
          if-no-files-found: error
