name: Refresh npm audit lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-npm-audit-fix.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply non-breaking npm audit fixes
        run: npm audit fix --package-lock-only
      - name: Show resulting audit status
        run: npm audit --audit-level=high || true
      - name: Commit lockfile changes
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo 'No package changes produced by npm audit fix.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json package.json
            git commit -m 'fix: apply non-breaking npm audit updates'
            git push
          fi
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/refresh-npm-audit-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time npm audit refresh workflow'
          git push

# one-time trigger
