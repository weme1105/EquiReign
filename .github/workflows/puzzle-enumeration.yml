name: Puzzle Enumeration

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: 'Board sizes to enumerate'
        required: true
        default: '6,7'
      target_per_solution:
        description: 'Candidate boards per symmetry-reduced Queen solution'
        required: true
        default: '10000'

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run puzzles:enumerate -- --sizes "${{ inputs.sizes }}" --target-per-solution "${{ inputs.target_per_solution }}"
      - name: Upload candidate pool
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-candidates-${{ github.run_number }}
          path: src/puzzles/enumerated-candidates.json
          if-no-files-found: error
