name: Puzzle Enumeration

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: 'Board sizes (6,7)'
        required: true
        default: '6,7'
      target_per_solution:
        description: 'Candidate boards per symmetry-reduced Queen solution'
        required: true
        default: '1000000'
      solution_indices:
        description: 'Optional 1-based solution indices, comma-separated; blank means all'
        required: false
        default: ''
      batch_size:
        description: 'Candidates per JSONL shard'
        required: true
        default: '10000'

jobs:
  enumerate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: 6
            solution_index: 1
          - size: 7
            solution_index: 1
          - size: 7
            solution_index: 2
          - size: 7
            solution_index: 3
          - size: 7
            solution_index: 4
          - size: 7
            solution_index: 5
          - size: 7
            solution_index: 6
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Enumerate solution shard
        if: ${{ contains(format(',{0},', inputs.sizes), format(',{0},', matrix.size)) && (inputs.solution_indices == '' || contains(format(',{0},', inputs.solution_indices), format(',{0},', matrix.solution_index))) }}
        run: npm run puzzles:enumerate-shard -- --size ${{ matrix.size }} --solution-index $(( ${{ matrix.solution_index }} - 1 )) --target-per-solution ${{ inputs.target_per_solution }} --batch-size ${{ inputs.batch_size }} --output-dir artifacts/puzzle-candidates
      - name: Upload solution shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-candidates-${{ matrix.size }}-solution-${{ matrix.solution_index }}-${{ github.run_number }}
          path: artifacts/puzzle-candidates/${{ matrix.size }}x${{ matrix.size }}/
          if-no-files-found: ignore
          retention-days: 7
