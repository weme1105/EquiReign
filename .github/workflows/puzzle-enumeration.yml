name: Puzzle Enumeration

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: 'Board sizes to enumerate (6,7)'
        required: true
        default: '6,7'
      target_per_solution:
        description: 'Candidate boards per symmetry-reduced Queen solution'
        required: true
        default: '1000000'
      solution_indices:
        description: 'Optional solution indices, 1-based; blank means all reduced solutions'
        required: false
        default: ''

jobs:
  enumerate:
    strategy:
      fail-fast: false
      matrix:
        size: [6, 7]
        solution_index: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Enumerate solution shard
        run: |
          case "${{ matrix.size }}-${{ matrix.solution_index }}" in
            6-0|7-0|7-1|7-2|7-3|7-4|7-5) ;;
            *) echo "Skipping nonexistent symmetry-reduced solution shard"; exit 0 ;;
          esac
          if [ -n "${{ inputs.solution_indices }}" ]; then
            echo ",${{ inputs.solution_indices }}," | grep -q ",$((${{ matrix.solution_index }} + 1))," || { echo "Skipping solution index"; exit 0; }
          fi
          npm run puzzles:enumerate -- --size "${{ matrix.size }}" --solution-index "${{ matrix.solution_index }}" --target-per-solution "${{ inputs.target_per_solution }}" --output-dir "artifacts/puzzle-candidates"
      - name: Upload solution shard
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-candidates-${{ matrix.size }}-solution-${{ matrix.solution_index }}-${{ github.run_number }}
          path: artifacts/puzzle-candidates/${{ matrix.size }}x${{ matrix.size }}/
          if-no-files-found: ignore
