name: Refresh patched dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit --audit-level=high || true
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/refresh-lockfile-js-yaml.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes needed."
            exit 0
          fi
          git commit -m "chore: refresh lockfile for patched js-yaml"
          git push
