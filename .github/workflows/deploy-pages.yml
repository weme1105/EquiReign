name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Optional main commit SHA to deploy. Leave blank to deploy current main.'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-site:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Resolve production source ref
        id: prod
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          if [ -n "$TARGET_SHA" ]; then
            echo "ref=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.prod.outputs.ref }}

      - name: Verify application scaffold
        run: |
          test -f package.json || { echo 'package.json not found; app scaffold is not ready for deployment.'; exit 1; }
          test -f package-lock.json || { echo 'package-lock.json not found; reproducible deployment requires npm lockfile.'; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Write deployment manifest
        run: |
          mkdir -p dist
          printf 'PROD_BRANCH=main\nPROD_SHA=%s\n' "$(git rev-parse HEAD)" > dist/deployment-version.txt
          cat dist/deployment-version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
