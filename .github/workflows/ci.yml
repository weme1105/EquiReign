name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Diagnose vulnerable dependency paths
        run: |
          npm ls js-yaml decode-uri-component uuid --all || true
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [k,v] of Object.entries(a.vulnerabilities||{})) if (['js-yaml','decode-uri-component','uuid'].includes(k)) console.log(JSON.stringify({name:k,range:v.range,severity:v.severity,isDirect:v.isDirect,via:v.via,fixAvailable:v.fixAvailable},null,2))"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - run: npm run audit
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/EquiReign.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
