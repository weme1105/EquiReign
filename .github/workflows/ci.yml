name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - run: npm run audit
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report/, if-no-files-found: ignore, retention-days: 7 }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-test-results, path: test-results/, if-no-files-found: ignore, retention-days: 7 }
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/EquiReign.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
