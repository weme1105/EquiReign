name: Generate bundled campaign

on:
  push:
    branches: [feature/server-authoritative-puzzles]
    paths:
      - scripts/build-bundled-campaign.ts
      - .github/workflows/generate-bundled-campaign.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/server-authoritative-puzzles
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/build-bundled-campaign.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/puzzles/bundled-campaign.generated.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(puzzles): generate bundled campaign levels"
          git pull --rebase origin feature/server-authoritative-puzzles
          git push origin HEAD:feature/server-authoritative-puzzles
