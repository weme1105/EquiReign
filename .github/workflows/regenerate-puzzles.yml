name: Regenerate bundled puzzles

on:
  push:
    branches: [feature/demo-variant-showcase]
    paths:
      - 'scripts/build-bundled-campaign.ts'
      - 'src/game-core/**'
      - 'src/puzzles/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: regenerate-puzzles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run puzzles:bundle
      - name: Commit generated puzzle catalog
        run: |
          if git diff --quiet -- src/puzzles/bundled-campaign.generated.ts; then
            echo 'Generated puzzle catalog is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/puzzles/bundled-campaign.generated.ts
          git commit -m 'chore: regenerate 150 unique bundled puzzles [skip ci]'
          git push
