name: Puzzle Enumeration Validation

on:
  workflow_dispatch:
    inputs:
      size:
        description: 'Board size'
        required: true
        default: '6'
      solution_index:
        description: 'Symmetry-reduced solution index'
        required: true
        default: '1'
      validation_count:
        description: 'Small candidate count used for validation'
        required: true
        default: '1000'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate validation candidates
        run: npm run puzzles:enumerate-shard -- --size "${{ inputs.size }}" --solution-index "${{ inputs.solution_index }}" --target-per-solution "${{ inputs.validation_count }}" --output-dir validation-candidates
      - name: Validate singleton-region constraint
        run: node --experimental-strip-types scripts/validate-puzzle-candidates.ts --input-dir validation-candidates
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-enumeration-validation-${{ inputs.size }}-s${{ inputs.solution_index }}
          path: validation-candidates

  enumerate-million:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate new 1,000,000 candidate pool
        run: npm run puzzles:enumerate-shard -- --size "${{ inputs.size }}" --solution-index "${{ inputs.solution_index }}" --target-per-solution 1000000 --output-dir million-candidates
      - name: Upload new million-candidate pool
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-candidates-${{ inputs.size }}-solution-${{ inputs.solution_index }}-million-v2
          path: million-candidates
